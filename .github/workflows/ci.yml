name: Build and test

on:
  push:
    branches: [main, dev, niuzj, 'feat/**', 'fix/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B --no-transfer-progress verify
      - run: python3 -m unittest discover -s judge-tests/tests -v
      - run: python3 -m unittest discover -s tools/tests -v
      - run: bash -n judge-images/build.sh judge-images/runner.sh judge-tests/security-sandbox-test.sh judge-tests/security-e2e-test.sh
      # compose 用 ${JWT_SECRET:?...} 强制要求生产密钥，CI 没有 .env（密钥不入库），
      # 这里只注入一次性占位值用于语法校验，绝不用于运行服务。
      - run: docker compose -f deploy/docker-compose.yml config --quiet
        env:
          JWT_SECRET: ci-only-placeholder-not-for-production-use-0123456789

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: oj-web
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: oj-web/package-lock.json
      - run: npm ci
      - run: npm run build
