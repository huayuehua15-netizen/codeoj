# oj-judge 判题服务配置（论文 4.6/5.4）
server:
  port: 8081

spring:
  application:
    name: oj-judge

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 与 oj-server 保持一致：serverTimezone 只告诉驱动"服务端时区"，不会下发 SET time_zone。
    # 判题服务回写 judged_at = NOW()（见 SubmissionMapper.updateFinalResult），
    # 若会话时区与 JVM 不一致，同一行记录的 created_at / judged_at 会相差 8 小时。
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:codeoj}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&sessionVariables=time_zone='%2B08:00'
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:123456}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: /
    listener:
      simple:
        # 公平分发 + 手动 ACK（论文 4.6：prefetch=1 保证任务按实际处理能力分配并形成背压）
        acknowledge-mode: manual
        prefetch: 1
        concurrency: ${JUDGE_CONCURRENCY:4}   # 实例内第一层并发控制（论文 5.4）

  jackson:
    time-zone: Asia/Shanghai

# 判题沙箱配置（论文表 4-9 / 5.4 docker run 参数）
oj:
  judge:
    # real=真实沙箱；mock=显式联调；local不提供真实判题结果
    engine-mode: ${ENGINE_MODE:real}
    # 实例内信号量：并行运行的容器数上限（防止 Docker 引擎过载）
    max-parallel-containers: ${MAX_PARALLEL_CONTAINERS:4}
    # 沙箱宿主机工作目录根（按执行批次和用例隔离）
    work-dir-root: ${JUDGE_WORK_DIR:/judge/work}
    # runner 脚本容器内路径
    runner-path: /judge/runner.sh
    # 用户程序运行身份；可信runner supervisor单独降权
    container-user: "1000:1000"
    # 宿主看护下限；实际硬时限同时覆盖该题墙钟时限和启动余量
    container-hard-timeout-ms: 15000
    # 输出上限：超过 16MB 判运行错误（论文 5.4）
    output-limit-bytes: 16777216
    # tmpfs /tmp 大小
    tmpfs-size: 64m

logging:
  level:
    com.codeoj: debug
