# =====================================================================
# oj-web Nginx 配置（论文 4.2/5.8）：静态资源托管 + /api、/ws 反向代理
# 注意：使用 Docker 内嵌 DNS（127.0.0.11）动态解析 oj-server，
#       避免服务容器重建后 IP 变化导致 502（proxy_pass 变量模式按请求解析）
# =====================================================================
server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # Vue3 SPA 静态资源
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 业务接口反向代理
    location /api/ {
        set $upstream http://oj-server:8080;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # WebSocket（STOMP/SockJS）反向代理（论文 2.6/5.5）
    location /ws/ {
        set $upstream http://oj-server:8080;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}
