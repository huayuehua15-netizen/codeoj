# =====================================================================
# 一键编排（论文 4.1 简单可运维 / 5.8 部署实现）
# 判题节点扩容：docker compose up -d --scale oj-judge=4
# =====================================================================
services:
  mysql:
    image: mysql:8.0
    container_name: oj-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: codeoj
      # SQL NOW() 与 JVM 时间戳同钟（见 oj-server 的 TZ 注释）
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      - ../sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysql --protocol=TCP -h127.0.0.1 -uroot --silent --skip-column-names -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [oj-net]

  redis:
    image: redis:7
    container_name: oj-redis
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis-data:/data
    networks: [oj-net]

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: oj-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - "15672:15672"   # 管理控制台（运维监控判题队列）
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 20
    networks: [oj-net]

  oj-server:
    build:
      context: ..
      dockerfile: deploy/oj-server/Dockerfile
    container_name: oj-server
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DB: codeoj
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      # 时钟统一 Asia/Shanghai（API.md §0.1：服务端时间即北京时间，前端不做换算）。
      # 缺此设置时 JVM 默认 UTC，而 MySQL/前端按 Shanghai 展示——同一张表两种时钟混写。
      TZ: Asia/Shanghai
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 未设置——生产密钥不允许回退到仓库内默认值，请在 deploy/.env 中生成（openssl rand -base64 48）}
      # 头像落盘目录（API.md v1.8）：容器内路径与静态映射 /uploads/** 对齐
      OJ_UPLOAD_ROOT_DIR: /app/uploads
      OJ_UPLOAD_AVATAR_DIR: /app/uploads/avatars
    volumes:
      # 头像文件持久化：容器重建不丢（README 部署段有说明）
      - ./data/server-uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks: [oj-net]

  oj-judge:
    build:
      context: ..
      dockerfile: deploy/oj-judge/Dockerfile
    environment:
      MYSQL_HOST: mysql
      MYSQL_DB: codeoj
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      ENGINE_MODE: ${ENGINE_MODE:-real}         # 生产默认真实沙箱判题；本地联调可设 mock
      # 与 oj-server 统一时钟（时间戳写入与展示口径一致，见 API.md §0.1）
      TZ: Asia/Shanghai
      JUDGE_CONCURRENCY: ${JUDGE_CONCURRENCY:-4} # 实例内并发消费线程数
      MAX_PARALLEL_CONTAINERS: ${MAX_PARALLEL_CONTAINERS:-4} # 实例内并行沙箱容器上限（与宿主机内存匹配）
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    # 判题服务需要访问宿主 Docker 引擎调度沙箱容器（论文 4.7：docker.sock 仅判题服务持有）
    # 工作目录必须宿主绑定：沙箱容器以 /judge/work/{sid} 挂载，需与判题服务共享同一宿主路径
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /judge/work:/judge/work
    deploy:
      replicas: 1   # 扩容：docker compose up -d --scale oj-judge=4
    networks: [oj-net]

  oj-web:
    build:
      context: ..
      # 默认在容器内构建前端；低内存服务器可设为 deploy/oj-web/Dockerfile.prebuilt，
      # 改为使用构建机预先生成的 deploy/web-dist 产物（见该文件头部说明）
      dockerfile: ${OJ_WEB_DOCKERFILE:-deploy/oj-web/Dockerfile}
    container_name: oj-web
    ports:
      - "80:80"
    # 挂载站点配置目录：改动后仅需重启容器，无需重建镜像
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
    depends_on:
      - oj-server
    networks: [oj-net]

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:

networks:
  oj-net:
    driver: bridge
