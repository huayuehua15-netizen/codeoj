# oj-server 业务服务配置（论文 4.2/5.1）
server:
  port: 8080

spring:
  application:
    name: oj-server

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # serverTimezone 只告诉驱动"服务端时区"，并不会给会话下发 SET time_zone。
    # 不显式下发时，Java 侧 LocalDateTime.now()（JVM 本地时区）与 SQL 侧 NOW()
    # （MySQL 容器默认 UTC）会相差 8 小时——同一行记录的 created_at 与 judged_at
    # 时间倒挂。sessionVariables 让会话时间与 JVM 保持一致（论文 4.4 时间一致性）。
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:codeoj}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&sessionVariables=time_zone='%2B08:00'
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:123456}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: /
    # 可靠投递：publisher-confirm 与 publisher-return（论文 4.6）
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: com.codeoj.common.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: false

# JWT 认证配置（论文 4.7：24 小时过期，登出进入 Redis 黑名单）
jwt:
  # 生产环境必须通过 JWT_SECRET 覆盖；默认值仅供本地开发，随仓库分发意味着
  # 任何人都能用它伪造任意 userId/role 的令牌。至少 32 字节才能满足 HS256 密钥强度。
  secret: ${JWT_SECRET:codeoj-dev-secret-key-please-change-in-production-0123456789}
  expire-hours: 24

# 限流配置（论文 4.7：登录失败 5 次锁定 15 分钟；提交 6 次/分/用户）
oj:
  rate-limit:
    login-max-attempts: 5
    login-lock-minutes: 15
    submit-per-minute: 6
  # 提交代码大小上限（论文 4.4：≤64KB）
  submit:
    max-code-bytes: 65536

logging:
  level:
    com.codeoj: debug
